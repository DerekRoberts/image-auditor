name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  self-check:
    name: Self-check
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system + Python deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif1
          pip install -r requirements.txt

      - name: Run --self-check
        run: |
          set -euo pipefail
          python image_cull.py --self-check

  docker:
    name: Docker
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke
        run: |
          set -euo pipefail
          docker build -t image-cull:ci .
          docker run --rm image-cull:ci --self-check

  lint:
    name: Lint
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff + shellcheck
        run: |
          set -euo pipefail
          pip install ruff
          ruff check image_cull.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck setup.sh

  trivy:
    name: Trivy
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-v0.36.0-cache-v1
          restore-keys: |
            ${{ runner.os }}-trivy-

      # Advisory only: findings land in the Security tab; exit-code 0 so Trivy never gates merge.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          cache-dir: .trivycache
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: trivy
          sarif_file: trivy-results.sarif

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Results
    needs: [self-check, docker, lint, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log upstream results
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Fail on failure or cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one required job failed or was cancelled."
          exit 1

      - name: Success
        run: echo "All required checks passed or were intentionally skipped."
